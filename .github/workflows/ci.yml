name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # lets buf-action comment on PRs

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          args: --build-tags=integration

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: buf lint, format and breaking-change check
        uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          lint: true
          format: true
          push: false # breaking runs on pull requests against the base branch

  test:
    needs: [lint, proto]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests (race detector, coverage)
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  integration:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Integration and reliability tests (Postgres via testcontainers-go)
        run: go test -race -count=1 -tags=integration ./internal/store/... ./test/reliability/...

  build:
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Build Docker image
        run: docker build -t results-server .
