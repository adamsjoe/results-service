name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # lets buf-action comment on PRs

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: buf lint, format and breaking-change check
        uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          lint: true
          format: true
          push: false # breaking runs on pull requests against the base branch

  build:
    needs: [lint, proto]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Build Docker image
        run: docker build -t results-server .
