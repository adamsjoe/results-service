# Loads every dashboard JSON file in /var/lib/grafana/dashboards. They are
# managed in the repo, so edits made in the Grafana UI are not saved.
apiVersion: 1

providers:
  - name: results
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
