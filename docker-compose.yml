name: results

x-db-url: &db-url postgres://results:results@postgres:5432/results?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: results
      POSTGRES_PASSWORD: results
      POSTGRES_DB: results
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U results -d results"]
      interval: 2s
      retries: 15

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      postgres: { condition: service_healthy }

  server:
    build: .
    environment:
      DATABASE_URL: *db-url
      GRPC_ADDR: ":9090"
      HTTP_ADDR: ":8080"
    ports: ["9090:9090", "8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres: { condition: service_healthy }

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      retries: 15

  tests:
    image: golang:1
    profiles: ["test"]
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://test:test@postgres-test:5432/test?sslmode=disable
    command: ["go", "test", "-race", "-tags=integration", "./..."]
    depends_on:
      postgres-test: { condition: service_healthy }

  k6:
    image: grafana/k6
    profiles: ["load"]
    volumes: ["./test/load:/scripts:ro"]
    environment:
      GRPC_TARGET: server:9090
      HTTP_TARGET: http://server:8080
    command: ["run", "/scripts/baseline.js"]
    depends_on:
      server: { condition: service_healthy }

volumes:
  pgdata:
  gomod:
  gocache:
